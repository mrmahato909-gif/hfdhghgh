<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎉 Birthday Surprise 🎉</title>

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;
    overflow-x:hidden;
    background:linear-gradient(135deg,#ff9a9e,#fad0c4,#fad0c4);
    background-size:400% 400%;
    animation:bgAnimation 15s ease infinite;
    text-align:center;
    color:#fff;
}

@keyframes bgAnimation{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

h1{
    font-family:'Pacifico',cursive;
    font-size:60px;
    margin-top:40px;
    animation:fadeIn 3s ease-in-out;
}

@keyframes fadeIn{
    from{opacity:0;}
    to{opacity:1;}
}

.subtitle{
    font-size:22px;
    margin-top:10px;
}

.section{
    padding:60px 20px;
}

button{
    padding:15px 30px;
    border:none;
    border-radius:30px;
    font-size:18px;
    cursor:pointer;
    background:#ff4081;
    color:white;
    transition:0.3s;
    margin-top:20px;
}

button:hover{
    background:#e91e63;
    transform:scale(1.1);
}

#surpriseMessage{
    display:none;
    font-size:28px;
    margin-top:30px;
    animation:zoomIn 1s ease forwards;
}

@keyframes zoomIn{
    from{transform:scale(0);}
    to{transform:scale(1);}
}

/* Balloon Animation */
.balloon{
    position:absolute;
    bottom:-150px;
    width:80px;
    height:100px;
    border-radius:50%;
    animation:floatUp 10s linear infinite;
}

.balloon::after{
    content:"";
    position:absolute;
    width:2px;
    height:60px;
    background:white;
    left:50%;
    top:100%;
}

@keyframes floatUp{
    0%{transform:translateY(0);}
    100%{transform:translateY(-120vh);}
}

/* Gallery */
.gallery{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:20px;
}

.gallery img{
    width:250px;
    height:250px;
    object-fit:cover;
    border-radius:20px;
    transition:0.5s;
}

.gallery img:hover{
    transform:scale(1.1) rotate(5deg);
}

/* Countdown */
#countdown{
    font-size:30px;
    margin-top:20px;
    font-weight:bold;
}

/* Confetti */
.confetti{
    position:fixed;
    width:10px;
    height:10px;
    background:red;
    top:0;
    animation:fall linear infinite;
}

@keyframes fall{
    0%{transform:translateY(0) rotate(0deg);}
    100%{transform:translateY(100vh) rotate(360deg);}
}

footer{
    padding:20px;
    background:rgba(0,0,0,0.3);
}
</style>
</head>

<body>

<h1>🎉 Happy Birthday 🎂</h1>
<p class="subtitle">Today is all about YOU! 💖</p>

<div class="section">
    <h2>Countdown to Celebration 🎈</h2>
    <div id="countdown">Loading...</div>
</div>

<div class="section">
    <h2>Click Below for Your Surprise 🎁</h2>
    <button onclick="showSurprise()">Open Surprise</button>
    <div id="surpriseMessage">
        🎊 Wishing you endless happiness, success, and love! 🎊<br>
        May all your dreams come true! 💕✨
    </div>
</div>

<div class="section">
    <h2>Memories Gallery 📸</h2>
    <div class="gallery">
        <img src="https://picsum.photos/300?1">
        <img src="https://picsum.photos/300?2">
        <img src="https://picsum.photos/300?3">
        <img src="https://picsum.photos/300?4">
        <img src="https://picsum.photos/300?5">
        <img src="https://picsum.photos/300?6">
    </div>
</div>

<div class="section">
    <h2>Play Birthday Music 🎵</h2>
    <audio controls autoplay loop>
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
    </audio>
</div>

<footer>
    Made with ❤️ for Someone Special
</footer>

<script>
function showSurprise(){
    document.getElementById("surpriseMessage").style.display="block";
    launchConfetti();
}

/* Countdown */
var birthday = new Date();
birthday.setHours(birthday.getHours()+5);

var x = setInterval(function(){
    var now = new Date().getTime();
    var distance = birthday - now;

    var hours = Math.floor((distance%(1000*60*60*24))/(1000*60*60));
    var minutes = Math.floor((distance%(1000*60*60))/(1000*60));
    var seconds = Math.floor((distance%(1000*60))/1000);

    document.getElementById("countdown").innerHTML =
    hours + "h " + minutes + "m " + seconds + "s ";

    if(distance < 0){
        clearInterval(x);
        document.getElementById("countdown").innerHTML="🎉 It's Party Time! 🎉";
    }
},1000);

/* Balloons */
for(let i=0;i<15;i++){
    let balloon=document.createElement("div");
    balloon.className="balloon";
    balloon.style.left=Math.random()*100+"vw";
    balloon.style.background="hsl("+Math.random()*360+",70%,60%)";
    balloon.style.animationDuration=(6+Math.random()*5)+"s";
    document.body.appendChild(balloon);
}

/* Confetti */
function launchConfetti(){
    for(let i=0;i<100;i++){
        let confetti=document.createElement("div");
        confetti.className="confetti";
        confetti.style.left=Math.random()*100+"vw";
        confetti.style.background="hsl("+Math.random()*360+",100%,50%)";
        confetti.style.animationDuration=(2+Math.random()*3)+"s";
        document.body.appendChild(confetti);
        setTimeout(()=>{confetti.remove();},5000);
    }
}
</script>

</body>
</html>
